<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Database Karyawan</title>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; color: #1e293b; margin-bottom: 25px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        label { font-weight: 600; font-size: 14px; margin-bottom: 5px; display: block; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        button { background-color: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #1d4ed8; }
        button.danger { background-color: #ef4444; padding: 6px 12px; font-size: 12px; }
        button.danger:hover { background-color: #dc2626; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background-color: #f8fafc; color: #475569; }
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .badge-tetap { background-color: #dcfce7; color: #15803d; }
        .badge-kontrak { background-color: #fef9c3; color: #a16207; }
        .badge-magang { background-color: #e0f2fe; color: #0369a1; }
        .search-box { margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sistem Database Karyawan</h1>

        <!-- FORM TAMBAH KARYAWAN -->
        <div class="card">
            <h2>+ Tambah Data Karyawan</h2>
            <form id="employeeForm">
                <div class="form-grid">
                    <div>
                        <label>NIK Karyawan:</label>
                        <input type="text" id="nik" placeholder="Contoh: K-202601" required>
                    </div>
                    <div>
                        <label>Nama Lengkap:</label>
                        <input type="text" id="nama" placeholder="Contoh: Budi Santoso" required>
                    </div>
                    <div>
                        <label>Jabatan:</label>
                        <input type="text" id="jabatan" placeholder="Contoh: Operator / Supervisor" required>
                    </div>
                    <div>
                        <label>Departemen:</label>
                        <select id="departemen">
                            <option value="Operational">Operational</option>
                            <option value="Maintenance">Maintenance</option>
                            <option value="HR & Legal">HR & Legal</option>
                            <option value="Finance">Finance</option>
                            <option value="HSE">HSE</option>
                        </select>
                    </div>
                    <div>
                        <label>Status Kerja:</label>
                        <select id="status">
                            <option value="Tetap">Tetap</option>
                            <option value="Kontrak">Kontrak</option>
                            <option value="Magang">Magang</option>
                        </select>
                    </div>
                    <div>
                        <label>Nomor HP / WA:</label>
                        <input type="text" id="noHp" placeholder="0812xxxxxxxx" required>
                    </div>
                </div>
                <button type="submit">Simpan Data Karyawan</button>
            </form>
        </div>

        <!-- TABEL DATA KARYAWAN -->
        <div class="card">
            <h2>Daftar Karyawan</h2>
            <input type="text" id="searchBox" class="search-box" placeholder="Cari berdasarkan nama/NIK..." onkeyup="filterEmployees()">
            
            <table>
                <thead>
                    <tr>
                        <th>NIK</th>
                        <th>Nama</th>
                        <th>Jabatan</th>
                        <th>Departemen</th>
                        <th>Status</th>
                        <th>No HP</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="employeeTableBody">
                    <tr><td colspan="7" style="text-align: center;">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Inisialisasi Supabase
        const SUPABASE_URL = 'https://nnpihyxmckwetfaypsyk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ucGloeXhtY2t3ZXRmYXlwc3lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5ODY2OTgsImV4cCI6MjEwNTU2MjY5OH0.FLALmEmC8HqCj-VwLEYsIBk-RpGY22epjx04KlZymiI';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allEmployees = [];

        // Fetch Data Karyawan dari Supabase
        async function fetchEmployees() {
            const tbody = document.getElementById('employeeTableBody');
            const { data, error } = await supabase
                .from('karyawan')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="7">Gagal memuat data: ${error.message}</td></tr>`;
                return;
            }

            allEmployees = data;
            renderTable(allEmployees);
        }

        // Render Tabel
        function renderTable(dataList) {
            const tbody = document.getElementById('employeeTableBody');
            
            if (dataList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Belum ada data karyawan.</td></tr>';
                return;
            }

            tbody.innerHTML = dataList.map(e => `
                <tr>
                    <td><strong>${e.nik}</strong></td>
                    <td>${e.nama}</td>
                    <td>${e.jabatan}</td>
                    <td>${e.departemen}</td>
                    <td><span class="badge badge-${e.status.toLowerCase()}">${e.status}</span></td>
                    <td>${e.no_hp}</td>
                    <td>
                        <button class="danger" onclick="deleteEmployee(${e.id}, '${e.nama}')">Hapus</button>
                    </td>
                </tr>
            `).join('');
        }

        // Simpan Karyawan Baru
        document.getElementById('employeeForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const newEmployee = {
                nik: document.getElementById('nik').value,
                nama: document.getElementById('nama').value,
                jabatan: document.getElementById('jabatan').value,
                departemen: document.getElementById('departemen').value,
                status: document.getElementById('status').value,
                no_hp: document.getElementById('noHp').value
            };

            const { error } = await supabase.from('karyawan').insert([newEmployee]);

            if (error) {
                alert('Gagal menyimpan data: ' + error.message);
            } else {
                alert('Data Karyawan berhasil disimpan!');
                this.reset();
                fetchEmployees();
            }
        });

        // Hapus Data Karyawan
        async function deleteEmployee(id, nama) {
            if (confirm(`Apakah Anda yakin ingin menghapus data karyawan ${nama}?`)) {
                const { error } = await supabase.from('karyawan').delete().eq('id', id);
                if (error) {
                    alert('Gagal menghapus: ' + error.message);
                } else {
                    fetchEmployees();
                }
            }
        }

        // Fitur Pencarian Realtime
        function filterEmployees() {
            const keyword = document.getElementById('searchBox').value.toLowerCase();
            const filtered = allEmployees.filter(e => 
                e.nama.toLowerCase().includes(keyword) || 
                e.nik.toLowerCase().includes(keyword) ||
                e.jabatan.toLowerCase().includes(keyword)
            );
            renderTable(filtered);
        }

        // Jalankan saat pertama kali dibuka
        fetchEmployees();
    </script>
</body>
</html>
